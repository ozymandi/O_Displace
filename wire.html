<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire — O'Gen</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ─── Palette Modal ─────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="paletteModal">
    <div class="modal-box">
        <div class="modal-title">Custom Palette</div>

        <div class="color-slots">
            <div class="color-slot">
                <input type="color" id="c0" value="#FF0055">
                <input type="text"  id="h0" value="#FF0055" maxlength="7" class="hex-input">
                <input type="checkbox" id="en0" checked title="Enable">
            </div>
            <div class="color-slot">
                <input type="color" id="c1" value="#00FFCC">
                <input type="text"  id="h1" value="#00FFCC" maxlength="7" class="hex-input">
                <input type="checkbox" id="en1" checked title="Enable">
            </div>
            <div class="color-slot">
                <input type="color" id="c2" value="#9D00FF">
                <input type="text"  id="h2" value="#9D00FF" maxlength="7" class="hex-input">
                <input type="checkbox" id="en2" checked title="Enable">
            </div>
            <div class="color-slot">
                <input type="color" id="c3" value="#2B0F4C">
                <input type="text"  id="h3" value="#2B0F4C" maxlength="7" class="hex-input">
                <input type="checkbox" id="en3" checked title="Enable">
            </div>
            <div class="color-slot">
                <input type="color" id="c4" value="#FFFFFF">
                <input type="text"  id="h4" value="#FFFFFF" maxlength="7" class="hex-input">
                <input type="checkbox" id="en4" checked title="Enable">
            </div>
        </div>

        <textarea class="modal-paste" id="hexPaste" placeholder="Paste CSS, XML, HEX, or rgb() here…"></textarea>

        <div class="modal-actions">
            <input type="file" id="aseFile" accept=".ase" style="display:none">
            <button onclick="document.getElementById('aseFile').click()">Load .ase</button>
            <button class="btn-generate" onclick="closePaletteModal()">Apply & Close</button>
        </div>
    </div>
</div>

<!-- ─── Left Panel ───────────────────────────────────────────────────────── -->
<div class="controls">
    <div class="panel-title">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        Wire
    </div>

    <!-- Seed + Seamless -->
    <div class="seed-row">
        <label>Seed</label>
        <input type="text" id="seedDisplay" readonly>
        <div class="live-wrap">
            <label for="livePreview">Live</label>
            <input type="checkbox" id="livePreview" checked>
        </div>
        <div class="live-wrap">
            <label for="seamlessEnable">Seamless</label>
            <input type="checkbox" id="seamlessEnable" onchange="handleInput()">
        </div>
    </div>

    <!-- Render mode -->
    <select id="renderMode" onchange="handleInput()">
        <option value="color">Color (Albedo)</option>
        <option value="depth">Depth Map (Height)</option>
        <option value="normal">Normal Map</option>
    </select>

    <!-- Palette -->
    <div class="select-row">
        <select id="paletteSelect" onchange="handlePaletteChange()">
            <option value="grayscale">Grayscale (Classic)</option>
            <option value="custom">Custom (Paste / ASE)</option>
            <option value="cyberpunk">Cyberpunk (Neon)</option>
            <option value="mars">Mars Base (Orange/Red)</option>
            <option value="ocean">Deep Ocean (Blues)</option>
        </select>
        <button id="editCustomBtn" class="btn-icon" onclick="openPaletteModal()" title="Edit palette" style="display:none">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- Bg Brightness -->
    <div class="module-group">
        <div class="row">
            <label>Bg Brightness</label>
            <input type="range" id="bgBrightness" min="0" max="255" value="8" oninput="handleInput()">
        </div>
    </div>

    <!-- Wire Paths -->
    <div class="module-group">
        <div class="module-header">
            <div class="module-title">
                <svg viewBox="0 0 24 24"><path d="M2 12h4l3-8 4 16 3-8h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Wire Paths
            </div>
        </div>
        <div class="row"><label>Layer count</label>       <input type="range" id="layerCount"      min="1"  max="24"   value="12"  oninput="handleInput()"></div>
        <div class="row"><label>Wires per layer</label>   <input type="range" id="wiresPerLayer"   min="1"  max="10"   value="3"   oninput="handleInput()"></div>
        <div class="row"><label>Max wire width</label>    <input type="range" id="maxWireWidth"    min="1"  max="64"   value="32"  oninput="handleInput()"></div>
        <div class="row"><label>Max origin spread</label> <input type="range" id="maxOriginSpread" min="0"  max="512"  value="0"   oninput="handleInput()"></div>
        <div class="row"><label>Min step length</label>   <input type="range" id="minStepLength"   min="8"  max="256"  value="64"  oninput="handleInput()"></div>
        <div class="row"><label>Max step length</label>   <input type="range" id="maxStepLength"   min="64" max="2048" value="512" oninput="handleInput()"></div>
    </div>

    <!-- Wire color mode -->
    <div class="module-group">
        <div class="module-header">
            <div class="module-title">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/></svg>
                Wire color mode
            </div>
        </div>
        <div class="seg-group" data-param="colorMode">
            <button class="seg-btn active" data-value="linear">Linear</button>
            <button class="seg-btn" data-value="inv-linear">Inverted</button>
            <button class="seg-btn" data-value="curve">Curve</button>
            <button class="seg-btn" data-value="inv-curve">Inv. curve</button>
            <button class="seg-btn" data-value="random">Random</button>
        </div>
    </div>

    <!-- Wire width mode -->
    <div class="module-group">
        <div class="module-header">
            <div class="module-title">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Wire width mode
            </div>
        </div>
        <div class="seg-group" data-param="widthMode">
            <button class="seg-btn" data-value="linear">Linear</button>
            <button class="seg-btn" data-value="inv-linear">Inverted</button>
            <button class="seg-btn" data-value="curve">Curve</button>
            <button class="seg-btn" data-value="inv-curve">Inv. curve</button>
            <button class="seg-btn active" data-value="random">Random</button>
        </div>
    </div>

    <!-- Step directions -->
    <div class="module-group">
        <div class="module-header">
            <div class="module-title">
                <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                Step directions
            </div>
        </div>
        <div class="seg-group" data-param="stepDirections">
            <button class="seg-btn active" data-value="any">Any</button>
            <button class="seg-btn" data-value="cardinal">Cardinal</button>
            <button class="seg-btn" data-value="diagonal">Diagonal</button>
            <button class="seg-btn" data-value="conical">Conical</button>
            <button class="seg-btn" data-value="burst">Burst</button>
        </div>
    </div>

    <!-- Symmetry -->
    <div class="module-group">
        <div class="module-header">
            <div class="module-title">
                <svg viewBox="0 0 24 24"><path d="M12 3v18M3 9l4 3-4 3M21 9l-4 3 4 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Symmetry
            </div>
        </div>
        <div class="seg-group" data-param="symmetry">
            <button class="seg-btn active" data-value="none">None</button>
            <button class="seg-btn" data-value="horizontal">Horizontal</button>
            <button class="seg-btn" data-value="vertical">Vertical</button>
            <button class="seg-btn" data-value="both">H + V</button>
            <button class="seg-btn" data-value="radial">Radial</button>
        </div>
        <div class="row"><label>Radial steps</label><input type="range" id="radialSteps" min="2" max="12" value="6" oninput="handleInput()"></div>
    </div>

    <!-- Actions -->
    <div class="actions-grid">
        <button class="btn-generate" onclick="generateNew()">Generate New Seed</button>
        <button class="btn-reset" onclick="resetDefaults()" title="Reset all settings to defaults">↺</button>
        <button class="btn-export" id="btnExportSVG">Save SVG</button>
        <button class="btn-png" id="btnExportPNG">Save PNG</button>
    </div>

    <!-- PNG scale popup -->
    <div id="pngPopup" class="png-popup" style="display:none;">
        <div class="png-popup-inner">
            <div class="scale-group">
                <button class="scale-btn active" data-scale="1">1×<span>1024px</span></button>
                <button class="scale-btn" data-scale="2">2×<span>2048px</span></button>
                <button class="scale-btn" data-scale="3">3×<span>3072px</span></button>
                <button class="scale-btn" data-scale="4">4×<span>4096px</span></button>
            </div>
            <input type="hidden" id="pngScale" value="1">
            <button class="btn-png btn-png-confirm" id="btnPngConfirm">Export PNG</button>
        </div>
    </div>

    <!-- Console -->
    <div class="console-panel">
        <label>Console</label>
        <textarea id="consoleLog" readonly></textarea>
    </div>
</div>

<!-- ─── Viewport ──────────────────────────────────────────────────────────── -->
<div class="viewport">
    <div id="svgContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
</div>

<script type="module" src="js/wire-main.js"></script>
</body>
</html>
