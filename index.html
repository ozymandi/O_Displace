<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'Gen</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 40px;
        }

        .hub-header { text-align: center; }

        .hub-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--ob-ink);
            letter-spacing: -0.5px;
            margin: 0 0 6px;
        }

        .hub-sub {
            font-size: 12px;
            color: var(--ob-muted);
        }

        .generator-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gen-card {
            width: 260px;
            background: var(--ob-panel);
            border: 1px solid var(--ob-line);
            border-radius: var(--ob-radius-shell);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .gen-card:hover {
            border-color: var(--ob-line-2);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .gen-card.disabled {
            opacity: 0.45;
            pointer-events: none;
        }

        .gen-preview {
            width: 100%;
            aspect-ratio: 1;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        .gen-preview svg { width: 100%; height: 100%; display: block; }

        .gen-info {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid var(--ob-line);
        }

        .gen-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--ob-ink);
        }

        .gen-desc {
            font-size: 11px;
            color: var(--ob-muted);
            line-height: 1.4;
        }

        .gen-badge {
            display: inline-flex;
            align-items: center;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 6px;
            border-radius: 3px;
            margin-top: 4px;
            width: fit-content;
        }

        .badge-ready  { background: rgba(27, 196, 125, 0.15); color: var(--ob-success); }
        .badge-soon   { background: rgba(255, 255, 255, 0.06); color: var(--ob-muted); }
    </style>
</head>
<body>

<div class="hub-header">
    <h1 class="hub-title">O'Gen</h1>
    <p class="hub-sub">Procedural texture generators</p>
</div>

<div class="generator-grid">

    <!-- Standard Block -->
    <a href="standard-block.html" class="gen-card">
        <div class="gen-preview">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260">
                <rect width="260" height="260" fill="#1a1a1a"/>
                <rect x="10" y="10" width="80" height="80" fill="#333"/>
                <rect x="100" y="10" width="50" height="50" fill="#444" fill-opacity=".7"/>
                <rect x="160" y="10" width="90" height="90" fill="#2a2a2a"/>
                <rect x="10" y="100" width="130" height="40" fill="#3a3a3a" fill-opacity=".5"/>
                <rect x="10" y="150" width="60" height="100" fill="#444"/>
                <rect x="80" y="150" width="100" height="60" fill="#333"/>
                <rect x="190" y="110" width="60" height="140" fill="#3a3a3a"/>
                <rect x="150" y="220" width="30" height="4" fill="#555"/>
                <rect x="150" y="230" width="30" height="3" fill="#555"/>
                <rect x="150" y="238" width="30" height="2" fill="#555"/>
                <rect x="80" y="220" width="60" height="40" fill="#2a2a2a" fill-opacity=".6"/>
                <line x1="40" y1="0" x2="40" y2="260" stroke="#555" stroke-width="1" opacity=".3"/>
                <line x1="0" y1="140" x2="260" y2="140" stroke="#555" stroke-width="1" opacity=".3"/>
                <rect x="30" y="30" width="20" height="20" fill="#555" fill-opacity=".4"/>
                <rect x="55" y="30" width="8" height="20" fill="#666" fill-opacity=".4"/>
                <rect x="30" y="55" width="40" height="8" fill="#666" fill-opacity=".4"/>
            </svg>
        </div>
        <div class="gen-info">
            <div class="gen-name">Standard Block</div>
            <div class="gen-desc">Geometric blocks, bars, grids and wires. PBR-ready — color, depth and normal map output.</div>
            <span class="gen-badge badge-ready">Ready</span>
        </div>
    </a>

    <!-- Wire -->
    <div class="gen-card disabled">
        <div class="gen-preview">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260">
                <rect width="260" height="260" fill="#1a1a1a"/>
                <line x1="130" y1="0"   x2="130" y2="260" stroke="#444" stroke-width="2"/>
                <line x1="0"   y1="130" x2="260" y2="130" stroke="#444" stroke-width="2"/>
                <rect x="118" y="118" width="24" height="24" fill="none" stroke="#555" stroke-width="2"/>
                <rect x="108" y="108" width="44" height="44" fill="none" stroke="#444" stroke-width="1.5"/>
                <line x1="60"  y1="0"   x2="60"  y2="260" stroke="#333" stroke-width="1.5"/>
                <line x1="200" y1="0"   x2="200" y2="260" stroke="#333" stroke-width="1.5"/>
                <line x1="0"   y1="60"  x2="260" y2="60"  stroke="#333" stroke-width="1.5"/>
                <line x1="0"   y1="200" x2="260" y2="200" stroke="#333" stroke-width="1.5"/>
                <rect x="48"  y="48"  width="24" height="24" fill="none" stroke="#444" stroke-width="1.5"/>
                <rect x="188" y="48"  width="24" height="24" fill="none" stroke="#444" stroke-width="1.5"/>
                <rect x="48"  y="188" width="24" height="24" fill="none" stroke="#444" stroke-width="1.5"/>
                <rect x="188" y="188" width="24" height="24" fill="none" stroke="#444" stroke-width="1.5"/>
            </svg>
        </div>
        <div class="gen-info">
            <div class="gen-name">Wire</div>
            <div class="gen-desc">Cross-wire circuits, node grids and connector patterns. High-density line networks.</div>
            <span class="gen-badge badge-soon">Coming soon</span>
        </div>
    </div>

</div>

</body>
</html>
